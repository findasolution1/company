<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기 - Find a solution</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">FIND A SOLUTION</a></div>
        <nav>
            <ul>
                <li><a href="index.html">홈</a></li>
                <li><a href="about.html">회사소개</a></li>
                <li><a href="process.html">시공 프로세스</a></li>
                <li><a href="portfolio.html">시공사례</a></li>
                <li><a href="contact.html">문의하기</a></li>
            </ul>
        </nav>
    </header>

    <section class="sub-page contact-page">
        <div class="section-header">
            <h2>문의하기</h2>
            <p>현장 실측 및 체육관 창업 관련 인테리어 상담을 환영합니다.</p>
        </div>
        
        <div class="contact-container">
            <!-- 연락처 정보 영역 -->
            <div class="contact-info-box">
                <h3>Contact Information</h3>
                <p>궁금한 점이 있으시거나 견적이 필요하시다면<br>언제든 편하게 연락 주세요.</p>
                <ul>
                    <li><strong>TEL.</strong> 010-4092-5906</li>
                    <li><strong>EMAIL.</strong> contact@findasolution.com</li>
                    <li><strong>INSTA.</strong> @findasolution_official</li>
                    <li><strong>ADDRESS.</strong> 서울특별시 강남구 OOO로 123, 1층</li>
                </ul>
            </div>

            <!-- 문의 폼 영역 -->
            <div class="contact-form-box">
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="name">성함 / 업체명</label>
                        <input type="text" id="name" placeholder="홍길동 / OOO 피트니스">
                    </div>
                    <div class="form-group">
                        <label for="phone">연락처</label>
                        <input type="tel" id="phone" placeholder="010-0000-0000">
                    </div>
                    <div class="form-group">
                        <label for="message">문의 내용 (면적, 시공 종류 등)</label>
                        <textarea id="message" rows="5" placeholder="현장 평수와 원하시는 시공(예: 에버롤 바닥, 복싱링 제작 등)을 적어주시면 더 빠른 상담이 가능합니다."></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">상담 신청하기</button>
                </form>
            </div>
        </div>
    </section>

</body>
</html>
