<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
    
    <!-- 헤더 & 네비게이션 -->
    <header>
        <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">FIND A SOLUTION</a></div>
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">회사소개</a></li>
                <li><a href="process.html">프로세스</a></li>
                <li><a href="portfolio.html" style="color: var(--accent);">포트폴리오</a></li>
                <li><a href="contact.html">문의하기</a></li>
            </ul>
        </nav>
    </header>

    <!-- 포트폴리오 본문 섹션 -->
    <section class="sub-page">
        <div class="section-header">
            <h2>Portfolio</h2>
            <p>파인드어솔루션이 직접 설계하고 시공한 스포츠 공간을 확인해보세요.</p>
        </div>

        <!-- 4장 1줄 고정 그리드 -->
        <div class="portfolio-grid" id="portfolioGrid">
            <!-- JS로 4개씩 동적 출력 -->
        </div>

        <!-- 1 ~ 10 페이지 버튼 -->
        <div class="pagination" id="pagination">
            <!-- JS로 페이지 버튼 생성 -->
        </div>
    </section>

    <!-- 푸터 -->
    <footer>
        <div class="footer-content">
            <h2 style="color: var(--accent); margin-bottom: 15px;">파인드어솔루션</h2>
            <div class="contact-info" style="margin-bottom: 20px;">
                <p><strong>대표자 :</strong> 송인식 &nbsp;|&nbsp; <strong>TEL :</strong> <a href="tel:010-4092-5906" style="color: inherit; text-decoration: none;">010-4092-5906</a></p>
                <p><strong>E-MAIL :</strong> <a href="mailto:songinshik1@naver.com" style="color: inherit; text-decoration: none;">songinshik1@naver.com</a></p>
                <p><strong>Instagram :</strong> @findasolution_official</p>
            </div>
            <div class="business-info" style="color: #666; font-size: 0.85rem; line-height: 1.8;">
                <p class="copyright" style="margin-top: 15px; color: #444;">© 2026 Find a solution. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- 포트폴리오 스크립트 -->
    <script>
        const images = [
            "sandbag.png",
            "main-bg.png",
            "rubber-mat.jpg",
            "turf-floor.jpg",
            "custom-bag.jpg"
        ];

        const gymTypes = ["크로스핏 박스", "복싱 클럽", "피트니스 센터", "필라테스 스튜디오", "태권도장", "MMA 격투기 짐"];
        const locations = ["강남", "성수", "한남", "홍대", "판교", "송도", "청담", "광교", "분당", "서초", "용산", "일산", "마포", "송파", "하남", "수원"];

        // 10페이지 x 4장 = 총 40개 데이터 생성
        const portfolioData = [];
        let count = 1;

        for (let page = 1; page <= 10; page++) {
            for (let i = 0; i < 4; i++) {
                const loc = locations[(count - 1) % locations.length];
                const type = gymTypes[(count - 1) % gymTypes.length];
                const img = images[(count - 1) % images.length];

                portfolioData.push({
                    id: count,
                    title: `${loc} ${type} 시공`,
                    desc: `고밀도 매트 및 맞춤형 ${type} 커스텀 설계`,
                    image: img,
                    page: page
                });
                count++;
            }
        }

        let currentPage = 1;

        function renderPortfolio(page) {
            const grid = document.getElementById("portfolioGrid");
            grid.innerHTML = "";

            const pageItems = portfolioData.filter(item => item.page === page);

            pageItems.forEach(item => {
                const card = document.createElement("div");
                card.className = "portfolio-item";
                card.innerHTML = `
                    <div class="feature-img">
                        <img src="${item.image}" alt="${item.title}" onerror="this.src='sandbag.png'">
                    </div>
                    <div class="portfolio-info">
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination() {
            const paginationContainer = document.getElementById("pagination");
            paginationContainer.innerHTML = "";

            // 이전 버튼
            const prevBtn = document.createElement("button");
            prevBtn.className = `page-btn ${currentPage === 1 ? 'disabled' : ''}`;
            prevBtn.innerHTML = "&lt;";
            prevBtn.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderPortfolio(currentPage);
                }
            };
            paginationContainer.appendChild(prevBtn);

            // 1 ~ 10 페이지 번호 버튼
            for (let i = 1; i <= 10; i++) {
                const pageBtn = document.createElement("button");
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.innerText = i;
                pageBtn.onclick = () => {
                    currentPage = i;
                    renderPortfolio(currentPage);
                };
                paginationContainer.appendChild(pageBtn);
            }

            // 다음 버튼
            const nextBtn = document.createElement("button");
            nextBtn.className = `page-btn ${currentPage === 10 ? 'disabled' : ''}`;
            nextBtn.innerHTML = "&gt;";
            nextBtn.onclick = () => {
                if (currentPage < 10) {
                    currentPage++;
                    renderPortfolio(currentPage);
                }
            };
            paginationContainer.appendChild(nextBtn);
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderPortfolio(1);
        });
    </script>
</body>
</html>
